# TrustBoard's own infrastructure.
# DataHub is brought up separately with its own quickstart (datahub docker
# quickstart), which is why it is not included here. Port 5433 avoids clashing
# with DataHub's internal PostgreSQL or with a local postgres on 5432.

services:
  trustboard-db:
    image: postgres:16-alpine
    container_name: trustboard-db
    environment:
      POSTGRES_USER: trustboard
      POSTGRES_PASSWORD: trustboard
      POSTGRES_DB: trustboard
    ports:
      - "5433:5432"
    volumes:
      - trustboard_pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustboard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trustboard_pgdata:
