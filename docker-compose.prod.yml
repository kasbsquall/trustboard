# Production deploy of the TrustBoard dashboard (backend + frontend).
# The dashboard is self-contained: it does not need DataHub, it serves the
# versioned history.
#
# Usage on the VPS (replace with your public IP/domain):
#   TRUSTBOARD_API_URL=http://YOUR_IP:8000 docker compose -f docker-compose.prod.yml up -d --build
#
# The dashboard ends up on http://YOUR_IP:3000 and the API on http://YOUR_IP:8000.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trustboard-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - trustboard_data:/data
    environment:
      CORS_ORIGINS: "*"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # PUBLIC backend URL (used by the browser). Change to the real IP/domain.
        NEXT_PUBLIC_API_URL: "${TRUSTBOARD_API_URL:-http://localhost:8000}"
    container_name: trustboard-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  trustboard_data:
