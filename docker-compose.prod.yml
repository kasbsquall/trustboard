# Production deploy of the TrustBoard dashboard (backend + frontend).
# The dashboard is self-contained: it does not need DataHub, it serves the
# versioned history.
#
# Both services bind to 127.0.0.1 by default and expect a reverse proxy in front
# of them terminating TLS. That is how the hosted demo runs. Publishing an app
# server straight onto a public IP means no TLS, no rate limiting and no access
# log, and a container that has to be redeployed to change any of that.
#
#   Behind a proxy on the same host (the default, and what you want):
#     TRUSTBOARD_API_URL=https://your.domain/api \
#     docker compose -f docker-compose.prod.yml up -d --build
#
#   Directly reachable, for a throwaway box with a firewall in front:
#     BIND_ADDRESS=0.0.0.0 TRUSTBOARD_API_URL=http://YOUR_IP:8000 \
#     docker compose -f docker-compose.prod.yml up -d --build
#
# TRUSTBOARD_API_URL is baked into the frontend bundle at build time, because the
# browser is what calls it. It has to be the URL a browser can reach, not the
# container name.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trustboard-backend
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - trustboard_data:/data
    environment:
      # The dashboard is read-only and carries no personal data, so a permissive
      # default is a considered choice rather than an oversight. Narrow it to
      # your own origin if you fork this for anything that writes.
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
    # A demo box has no business letting one container eat the machine. These are
    # sized for the actual workload: a FastAPI process serving a few hundred rows
    # out of SQLite.
    mem_limit: 512m
    cpus: 0.5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${TRUSTBOARD_API_URL:-http://localhost:8000}"
    container_name: trustboard-frontend
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    mem_limit: 512m
    cpus: 0.5

volumes:
  trustboard_data:
