name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      # The scoring model, the policy gate and the aspect-reading rules all run
      # without a DataHub instance on purpose: the logic lives in pure functions
      # and fakes, so a regression fails here rather than in a demo.
      - name: Tests
        run: pytest tests/ -q

      - name: Lint
        run: ruff check .

      # Every agent module has to import cleanly on a machine with no GMS. The
      # MCP server in particular used to die at import time if DataHub was not
      # up, which is exactly when an agent needs a readable error instead.
      - name: Import check without DataHub
        run: |
          python -c "import agents.auditor, agents.scribe, agents.incidents"
          python -c "import agents.trust_lookup, agents.gatekeeper, agents.herald"
          python -c "import mcp_server.trustboard_mcp, backend.main, run_week"

  # The deployed image is not the repo. The backend Dockerfile copies a subset of
  # the tree, and it was missing `scoring/`, which /api/model imports lazily: the
  # container started clean, every other route worked, and the one endpoint that
  # publishes the scoring rules returned a 500 in production. Tests and a build
  # both passed throughout, because neither runs the image. This does.
  deploy-image:
    name: Backend image serves the model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the backend image
        run: docker build -f backend/Dockerfile -t trustboard-backend .

      - name: Start it
        run: docker run -d --name tb -p 8000:8000 trustboard-backend

      - name: Every route answers, including the ones with lazy imports
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/model >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8000/api/model | tee /dev/stderr | grep -q '"weights"'
          curl -fsS http://localhost:8000/api/leaderboard >/dev/null

      - name: Logs on failure
        if: failure()
        run: docker logs tb

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

      # The image is not the build. A Dockerfile change took the deployed site
      # down while `npm run build` stayed green, because the base is Alpine and
      # the RUN line called a tool that only exists on Debian.
      - name: The image builds too
        working-directory: .
        run: docker build -f frontend/Dockerfile --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 -t tb-frontend frontend

      - name: And it serves the page as an unprivileged user
        working-directory: .
        run: |
          docker run -d --name tbf -p 3000:3000 tb-frontend
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3000/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:3000/ >/dev/null
          test "$(docker exec tbf id -u)" != "0"
